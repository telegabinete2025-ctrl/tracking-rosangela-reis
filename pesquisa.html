<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pesquisa de Voto — Ipatinga</title>
<style>
  :root{--verde:#1a7f37;--vermelho:#c62828;--azul:#0b5394;--cinza:#f2f3f5;--borda:#d9dde3;--sel:#0b5394}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--cinza);color:#1c1e21}
  header{background:var(--azul);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font-size:15px;font-weight:700}
  header .cont{background:#fff;color:var(--azul);border-radius:14px;padding:3px 10px;font-weight:800;font-size:14px}
  main{max-width:560px;margin:0 auto;padding:12px 10px 70px}
  .card{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:12px;margin-bottom:10px}
  h2{font-size:13px;margin:0 0 8px;color:var(--azul);text-transform:uppercase;letter-spacing:.4px}
  label{display:block;font-size:12px;font-weight:600;margin:8px 0 4px}
  select,input{width:100%;padding:10px;border:1px solid var(--borda);border-radius:8px;font-size:16px;background:#fff}
  .pergunta{font-size:12px;color:#666;margin:0 0 8px}
  .nome{margin-bottom:8px}
  .nome input{border:1.5px solid var(--borda)}
  .nome input:focus{border-color:var(--sel);outline:none}
  .nome input.tem{border-color:var(--verde);background:#f2faf4}
  .ops{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .ops button{padding:12px 4px;border:1.5px solid var(--borda);border-radius:8px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#1c1e21}
  .ops button.sel{background:var(--sel);border-color:var(--sel);color:#fff}
  #btnEnviar{width:100%;padding:16px;border:0;border-radius:10px;background:var(--verde);color:#fff;font-size:17px;font-weight:800;cursor:pointer;margin-top:4px}
  #btnEnviar:disabled{opacity:.5}
  #msg{margin-top:10px;padding:10px;border-radius:8px;font-size:14px;display:none;text-align:center}
  #msg.ok{display:block;background:#e6f4ea;color:var(--verde)}
  #msg.erro{display:block;background:#fdecea;color:var(--vermelho)}
  .aviso{font-size:11px;color:#8a6d1a;background:#fef7e0;border:1px solid #f5e3a3;border-radius:8px;padding:8px;margin-bottom:10px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>🗳️ PESQUISA DE VOTO — IPATINGA</h1>
  <span class="cont" id="contador">0 hoje</span>
</header>
<main>
<div class="aviso">USO EXCLUSIVAMENTE INTERNO — não divulgar resultados (Lei 9.504/97, art. 33). Entrevista anônima: não anote nome nem telefone do entrevistado.</div>

<div class="card">
  <h2>Identificação da coleta</h2>
  <label>Pesquisador(a)</label>
  <select id="pesquisador"><option value="">Carregando…</option></select>
  <label>Bairro da entrevista</label>
  <select id="bairro"><option value="">Carregando…</option></select>
</div>

<div class="card">
  <h2>Perfil do entrevistado</h2>
  <label>Sexo</label>
  <div class="ops" id="gSexo">
    <button data-v="F">Feminino</button><button data-v="M">Masculino</button><button data-v="NI">Não informar</button>
  </div>
  <label>Idade</label>
  <div class="ops" id="gFaixa" style="grid-template-columns:repeat(3,1fr)">
    <button data-v="16-24">16–24</button><button data-v="25-34">25–34</button><button data-v="35-44">35–44</button>
    <button data-v="45-59">45–59</button><button data-v="60+">60+</button><button data-v="NI">NI</button>
  </div>
</div>

<div id="cargos"></div>

<button id="btnEnviar">REGISTRAR ENTREVISTA</button>
<div id="msg"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(TRACKING_CONFIG.SUPABASE_URL, TRACKING_CONFIG.SUPABASE_KEY);
const $ = id => document.getElementById(id);
const hoje = () => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date());
const escolha = {sexo:null, faixa:null};

// Sequência da urna eletrônica
const CARGOS = [
  {campo:'federal',    titulo:'1º — Deputado FEDERAL',  pergunta:'"Se a eleição fosse hoje, em quem o(a) senhor(a) votaria para deputado federal?" (não cite nomes)'},
  {campo:'estadual',   titulo:'2º — Deputado ESTADUAL', pergunta:'"E para deputado estadual, em quem votaria?"'},
  {campo:'senador1',   titulo:'3º — Senador (1º voto)', pergunta:'"Este ano são DOIS votos para senador. Qual o primeiro nome?"'},
  {campo:'senador2',   titulo:'4º — Senador (2º voto)', pergunta:'"E o segundo nome para senador?"'},
  {campo:'governador', titulo:'5º — Governador',        pergunta:'"E para governador de Minas, em quem votaria?"'},
  {campo:'presidente', titulo:'6º — Presidente',        pergunta:'"E para presidente da República?"'}
];
const CODS = [['INDECISO','Não sabe'],['BRANCO_NULO','Branco/Nulo'],['NAO_RESPONDEU','Não respondeu']];

$('cargos').innerHTML = CARGOS.map(c=>`
  <div class="card">
    <h2>${c.titulo} — espontânea</h2>
    <p class="pergunta">${c.pergunta}</p>
    <div class="nome"><input id="n_${c.campo}" placeholder="Digite o nome citado" autocomplete="off" maxlength="80"></div>
    <div class="ops" id="g_${c.campo}">${CODS.map(([v,r])=>`<button data-v="${v}">${r}</button>`).join('')}</div>
  </div>`).join('');

function grupo(gid, chave){
  $(gid).addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    const ja=b.classList.contains('sel');
    [...$(gid).children].forEach(x=>x.classList.remove('sel'));
    if(ja){ escolha[chave]=null; return; }
    b.classList.add('sel'); escolha[chave]=b.dataset.v;
  });
}
grupo('gSexo','sexo'); grupo('gFaixa','faixa');

CARGOS.forEach(c=>{
  escolha[c.campo]=null;
  const inp=$('n_'+c.campo), g=$('g_'+c.campo);
  inp.addEventListener('input', ()=>{
    inp.classList.toggle('tem', !!inp.value.trim());
    if(inp.value.trim()){ [...g.children].forEach(x=>x.classList.remove('sel')); escolha[c.campo]=null; }
  });
  g.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    const ja=b.classList.contains('sel');
    [...g.children].forEach(x=>x.classList.remove('sel'));
    if(ja){ escolha[c.campo]=null; return; }
    b.classList.add('sel'); escolha[c.campo]=b.dataset.v;
    inp.value=''; inp.classList.remove('tem');
  });
});

const votoDe = c => { const n=$('n_'+c).value.trim(); return n || escolha[c]; };

async function init(){
  const [p,b] = await Promise.all([
    sb.from('v_tracking_pesquisadores').select('id,nome'),
    sb.from('v_tracking_bairros').select('nome')
  ]);
  if(p.error||b.error){ mostrar('erro','Falha ao carregar. Verifique a internet e recarregue.'); return; }
  $('pesquisador').innerHTML='<option value="">Selecione…</option>'+p.data.map(x=>`<option value="${x.id}">${x.nome}</option>`).join('');
  $('bairro').innerHTML='<option value="">Selecione…</option>'+b.data.map(x=>`<option>${x.nome}</option>`).join('');
  try{
    const up=localStorage.getItem('pesq_pesquisador'); if(up) $('pesquisador').value=up;
    const ub=localStorage.getItem('pesq_bairro'); if(ub) $('bairro').value=ub;
  }catch(_){}
  atualizarContador();
}

async function atualizarContador(){
  const pid=$('pesquisador').value; if(!pid) return;
  const {count} = await sb.from('tracking_entrevistas').select('id',{count:'exact',head:true})
    .eq('pesquisador_id',pid).eq('data',hoje()).eq('teste',false);
  $('contador').textContent=(count||0)+' hoje';
}
$('pesquisador').addEventListener('change', atualizarContador);

function mostrar(t,x){ const m=$('msg'); m.className=t; m.textContent=x; }

$('btnEnviar').addEventListener('click', async ()=>{
  if(!$('pesquisador').value) return mostrar('erro','Selecione o pesquisador.');
  if(!$('bairro').value) return mostrar('erro','Selecione o bairro.');
  for(const c of CARGOS){
    if(!votoDe(c.campo)) return mostrar('erro','Responda "'+c.titulo.replace(/^\d+º — /,'')+'": digite o nome ou marque uma opção.');
  }
  $('btnEnviar').disabled=true;
  const {error} = await sb.from('tracking_entrevistas').insert({
    data: hoje(),
    pesquisador_id: $('pesquisador').value,
    bairro: $('bairro').value,
    sexo: escolha.sexo||'NI',
    faixa_etaria: escolha.faixa||'NI',
    voto_federal: votoDe('federal'),
    voto_estadual: votoDe('estadual'),
    voto_senador1: votoDe('senador1'),
    voto_senador2: votoDe('senador2'),
    voto_governador: votoDe('governador'),
    voto_presidente: votoDe('presidente')
  });
  $('btnEnviar').disabled=false;
  if(error) return mostrar('erro','Erro ao enviar: '+error.message);
  try{
    localStorage.setItem('pesq_pesquisador',$('pesquisador').value);
    localStorage.setItem('pesq_bairro',$('bairro').value);
  }catch(_){}
  // limpa só a entrevista; mantém pesquisador e bairro para a próxima
  ['gSexo','gFaixa'].forEach(g=>[...$(g).children].forEach(x=>x.classList.remove('sel')));
  escolha.sexo=escolha.faixa=null;
  CARGOS.forEach(c=>{
    escolha[c.campo]=null;
    $('n_'+c.campo).value=''; $('n_'+c.campo).classList.remove('tem');
    [...$('g_'+c.campo).children].forEach(x=>x.classList.remove('sel'));
  });
  mostrar('ok','✅ Registrada! Pode partir para a próxima.');
  window.scrollTo({top:0,behavior:'smooth'});
  atualizarContador();
});
init();
</script>
</body>
</html>
